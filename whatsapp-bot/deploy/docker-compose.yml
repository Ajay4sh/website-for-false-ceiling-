# Run from this folder on your server:  docker compose up -d --build
# Needs ../.env (see .env.example) and DOMAIN set in it.
services:
  bookbot:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_FILE: /app/data/bookbot.db
      TRUST_PROXY: "true"
      PORT: "3000"
    volumes:
      - ../data:/app/data
      - ../secrets:/app/secrets:ro
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bookbot

volumes:
  caddy_data:
  caddy_config:
